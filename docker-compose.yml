# Statische Website des DC Torpedo
#
#   docker compose up -d
#
# "web"       liefert den Ordner public/ mit nginx aus (Konfiguration: deploy/nginx/).
# "liga-sync" holt alle 30 Minuten Tabelle & Spielplan nach public/data/.
# "admin"     Redaktion unter /admin/: speichert News als Commit auf GitHub
#             (braucht GITHUB_TOKEN in .env). Den Rest erledigt das Deploy.
#
# Vorher einmal bauen: node tools/build.mjs (bzw. deploy/deploy.sh auf dem Server).
#
# Alle Mounts sind Ordner, keine Einzeldateien: Git ersetzt Dateien beim
# Aktualisieren durch neue, und eingebundene Einzeldateien würden sonst
# im Container auf dem alten Stand bleiben.
#
# Der Port ist nur auf 127.0.0.1 erreichbar (Docker-Ports umgehen sonst die
# Firewall). Hinter nginx-proxy zusätzlich deploy/nginx-proxy.yml verwenden
# (siehe README). Port ändern: WEB_PORT=8085 in .env.

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - ./deploy/admin-auth:/etc/nginx/admin-auth:ro

  liga-sync:
    image: alpine:3.20
    restart: unless-stopped
    command: ["/bin/sh", "/repo/deploy/liga-sync.sh"]
    environment:
      CONFIG: /repo/site.config.json
      LIGA_OUT: /data/liga.json
      LIGA_INTERVAL: "1800"
    volumes:
      - .:/repo:ro
      - ./public/data:/data

  admin:
    image: node:22-alpine
    restart: unless-stopped
    user: node
    command: ["node", "/site/admin/server.mjs"]
    environment:
      SITE_DIR: /site
      STAGE_DIR: /tmp/uploads
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - .:/site:ro
