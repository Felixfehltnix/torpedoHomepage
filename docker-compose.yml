# Statische Website des DC Torpedo
#
#   docker compose up -d
#
# "web" liefert den Ordner public/ mit nginx aus.
# "liga-sync" holt alle 30 Minuten Tabelle & Spielplan nach public/data/.
#
# Port 8080 ist nur ein Vorschlag: Wenn vor dem WordPress-Container bisher ein
# Reverse-Proxy (Traefik, Caddy, nginx-proxy …) hängt, diesen einfach auf den
# "web"-Container zeigen lassen. Siehe README.md.

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/redirects.conf:/etc/nginx/snippets/redirects.conf:ro
      - ./deploy/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro

  liga-sync:
    image: alpine:3.20
    restart: unless-stopped
    command: ["/bin/sh", "/sync/liga-sync.sh"]
    environment:
      LIGA_INTERVAL: "1800"
    volumes:
      - ./deploy/liga-sync.sh:/sync/liga-sync.sh:ro
      - ./site.config.json:/config/site.config.json:ro
      - ./public/data:/data
