# nginx-Konfiguration für die statische Website des DC Torpedo
# Der ganze Ordner deploy/nginx/ wird als /etc/nginx/conf.d eingebunden.
# *.inc-Dateien erzeugt tools/build.mjs (nicht von Hand bearbeiten).

# torpedo-dc.de → www.torpedo-dc.de (hat bisher WordPress erledigt)
server {
    listen 80;
    server_name torpedo-dc.de;
    server_tokens off;
    return 301 https://www.torpedo-dc.de$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Sicherheits-Header (inkl. CSP) und Weiterleitungen alter WordPress-Adressen
    include /etc/nginx/conf.d/security-headers.inc;
    include /etc/nginx/conf.d/redirects.inc;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/xml application/rss+xml text/xml application/manifest+json;

    # Redaktion (News pflegen) – Passwortschutz per HTTP Basic Auth.
    # Zugangsdaten liegen in deploy/admin-auth/htpasswd (nicht im Git, siehe README).
    # Fehlt die Datei, bleibt der Bereich gesperrt.
    location ^~ /admin/ {
        auth_basic "DC Torpedo Redaktion";
        auth_basic_user_file /etc/nginx/admin-auth/htpasswd;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Schnittstelle zum Redaktions-Dienst (Container "admin")
    location ^~ /admin/api/ {
        auth_basic "DC Torpedo Redaktion";
        auth_basic_user_file /etc/nginx/admin-auth/htpasswd;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
        client_max_body_size 5m;
        proxy_read_timeout 180s;
        # Über eine Variable, damit nginx auch ohne laufenden admin-Container startet
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $admin_backend admin:3000;
        proxy_pass http://$admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Seiten: immer frisch
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # CSS/JS werden mit ?v=<hash> eingebunden → lange cachen
    location ~* \.(?:css|js)$ {
        expires 1y;
    }

    # Bilder & Schriften
    location ~* \.(?:webp|png|jpe?g|svg|ico|woff2)$ {
        expires 30d;
    }

    # Liga- und Live-Daten vom Sync-Container: nie cachen
    location ~ ^/data/(liga|live)\.json$ {
        expires -1;
    }

    error_page 404 /404.html;
}
