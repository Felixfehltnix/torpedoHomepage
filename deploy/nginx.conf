# nginx-Konfiguration für die statische Website des DC Torpedo
# Wird von docker-compose.yml als default.conf in den nginx-Container gelegt.

# torpedo-dc.de → www.torpedo-dc.de (hat bisher WordPress erledigt)
server {
    listen 80;
    server_name torpedo-dc.de;
    server_tokens off;
    return 301 https://www.torpedo-dc.de$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Sicherheits-Header (inkl. CSP) und Weiterleitungen alter WordPress-Adressen
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/redirects.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/xml application/rss+xml text/xml application/manifest+json;

    # Seiten: immer frisch
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # CSS/JS werden mit ?v=<hash> eingebunden → lange cachen
    location ~* \.(?:css|js)$ {
        expires 1y;
    }

    # Bilder & Schriften
    location ~* \.(?:webp|png|jpe?g|svg|ico|woff2)$ {
        expires 30d;
    }

    # Liga-Daten vom Sync-Container: nie cachen
    location = /data/liga.json {
        expires -1;
    }

    error_page 404 /404.html;
}
